<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D4Helper Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="studio">
 <aside class="library">
  <div class="brand"><span class="brand-mark">D4</span><div><strong>D4Helper</strong><small>STUDIO</small></div></div>
  <div class="library-heading"><span id="library-label"></span><button id="new-macro" class="icon-button" aria-label="New macro">+</button></div>
  <nav id="macro-list"></nav>
  <div class="library-footer"><button id="settings-button"></button><button id="hide-button"></button><button id="quit-button"></button></div>
 </aside>
 <main>
  <header class="topbar"><div class="title-wrap"><span class="eyebrow">MACRO WORKSPACE</span><h1 id="macro-name"></h1></div><div class="file-actions"><span id="save-state"></span><button id="open-button"></button><button id="save-button" class="primary"></button></div></header>
  <div class="runbar"><div class="target"><span id="target-dot" class="dot"></span><span id="target-label"></span><button id="target-button"></button></div><div class="run-actions"><button id="record-button" class="record-button"></button><button id="stop-button" class="stop-button"></button><button id="play-button" class="primary"></button></div></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="overlap-notice" class="overlap-notice" role="status" hidden><span>这个作品有同轨重叠动作，需要拆分后才能运行。动作时间会保持不变。</span><button id="split-tracks">拆分到多条轨道</button></div>
  <div class="workarea">
   <aside class="palette"><div class="pane-title" id="palette-title"></div><p class="pane-hint" id="palette-hint"></p><div id="action-library"></div><div class="palette-note" id="palette-note"></div></aside>
   <section class="editor">
    <div class="timeline-toolbar"><div class="tool-group"><button id="preview-button" class="preview-control">&#9654;</button><span id="time-readout">0.00s</span><span class="toolbar-divider"></span><span id="loop-status" class="playback-summary"></span></div><div class="tool-group"><button id="undo" class="icon-button" aria-label="Undo">&#8617;</button><button id="redo" class="icon-button" aria-label="Redo">&#8618;</button><label class="snap-label"><input id="snap" type="checkbox" checked><span id="snap-label"></span></label><button id="zoom-out" class="icon-button">&#8722;</button><span id="zoom-label">100%</span><button id="zoom-in" class="icon-button">+</button><button id="fit" class="small-button"></button></div></div>
    <div class="timeline-scroll" id="timeline-scroll" title="拖动动作块移动，拉右边缘改时长；Shift＋滚轮横移，Ctrl＋滚轮缩放"><div id="timeline-canvas"><div class="ruler-row"><div class="track-header ruler-label" id="track-label"></div><div id="ruler" class="ruler"></div></div><div id="tracks"></div><div id="loop-wait-region" class="loop-wait-region" hidden><span id="loop-wait-label"></span></div><div id="timeline-end" class="timeline-end"><span></span></div><div id="playhead" class="playhead"><span></span></div></div></div>
    <div class="timeline-bottom"><button id="add-track"></button><span id="timeline-help"></span><span class="duration-summary"><span id="length-label"></span> <span id="duration-readout"></span> ms<span id="cycle-summary" hidden> · 每轮 <span id="cycle-duration"></span> ms</span></span></div>
    <section class="preview-panel"><div class="preview-heading"><div><span class="eyebrow">PREVIEW</span><h2 id="preview-title"></h2></div><span id="event-count"></span></div><div id="preview-events"></div><div id="validation" role="status"></div></section>
   </section>
   <aside class="inspector"><div class="inspector-heading"><div class="pane-title" id="inspector-title"></div><div id="inspector-controls"></div></div><div id="inspector"></div></aside>
  </div>
  <footer class="statusbar"><span id="status-text"></span><span id="record-status"></span><span id="shortcut-tip"></span></footer>
 </main>
</div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2 id="settings-title"></h2><button id="close-settings" class="icon-button">&#215;</button></div><div id="settings-fields"></div><div class="dialog-actions"><button id="detect-button"></button><button id="settings-done" class="primary"></button></div><p id="settings-note"></p></dialog>
<script src="model.js"></script><script src="app.js"></script>
</body></html>
