name: Build D4Helper

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go-desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: go-desktop/package-lock.json

      - name: Go input safety, configuration and native service tests
        working-directory: go-desktop
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
      - name: Editor tests
        working-directory: go-desktop
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Editor tests failed' }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION v$version"
          }

      - name: Build executable
        shell: pwsh
        run: ./build.ps1

      - name: Desktop renderer and bridge smoke test
        shell: pwsh
        run: ./go-desktop/tools/smoke.ps1

      - name: Prepare portable release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionedArchive = ".\dist\D4Helper-Studio-v$env:VERSION.zip"
          if (-not (Test-Path -LiteralPath $versionedArchive)) {
            throw "Portable archive was not created: $versionedArchive"
          }
          Copy-Item -LiteralPath $versionedArchive -Destination ".\dist\D4Helper-windows-latest.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4Helper-windows-latest
          path: |
            dist/studio/D4Helper.exe
            dist/studio/workspace.timeline.json
            dist/studio/VERSION
            dist/D4Helper-Studio-v*.zip
            dist/D4Helper-windows-latest.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: D4Helper ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/D4Helper-windows-latest.zip
